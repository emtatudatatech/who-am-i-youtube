<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Who Am I? | YouTube</title>
    <meta name="description" content="A personal data-storytelling dashboard built from YouTube watch history." />
    <meta name="author" content="emtatudatatech" />

    <!-- Favicon: SVG for modern browsers, PNG fallback for the rest. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />

    <!-- Tints browser chrome on Android and iOS Safari; matches --page. -->
    <meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />

    <!-- Link previews (WhatsApp, Slack, X, LinkedIn, iMessage). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Who Am I? | YouTube" />
    <meta property="og:title" content="Who Am I? | YouTube" />
    <meta property="og:description" content="A personal watch-history story, told in charts — channels, categories, rhythms and repeats, from a Google Takeout export." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Who Am I? | YouTube — a personal watch-history story, told in charts." />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Who Am I? | YouTube" />
    <meta name="twitter:description" content="A personal watch-history story, told in charts — channels, categories, rhythms and repeats, from a Google Takeout export." />
    <!-- Absolute URLs injected at build time from PERSON — see vite.config.js. -->
    <!--BRAND_URLS-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
