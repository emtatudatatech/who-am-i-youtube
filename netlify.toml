[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Friendly /api/* path in front of the functions.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback: let React Router / client handle non-file routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
